<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OWASP Top 10 서술형 늘려 쓰기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#f4f5fb;--sf:#fff;--ink:#1b1f3a;--mu:#5b6082;--ln:#d9dcef;--ac:#4338ca;--acb:#e4e2fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10122a;--sf:#191c3a;--ink:#e8eaff;--mu:#a3a8d6;--ln:#2e3262;--ac:#9a94ff;--acb:#2a2866}}
:root[data-theme="dark"]{--bg:#10122a;--sf:#191c3a;--ink:#e8eaff;--mu:#a3a8d6;--ln:#2e3262;--ac:#9a94ff;--acb:#2a2866}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.8 "Noto Sans KR",system-ui,sans-serif}
.w{max-width:860px;margin:0 auto;padding:36px 20px 56px}
h1{font-size:clamp(26px,5vw,42px);line-height:1.2;margin:0 0 10px;font-weight:900}
.lead{color:var(--mu);margin:0 0 20px}
.fr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.fr span{background:var(--acb);color:var(--ac);border-radius:6px;padding:2px 10px;font-size:14px;font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tabs button,.ctl button{font:inherit;font-size:15px;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:6px 14px;cursor:pointer}
.tabs button[aria-selected="true"],.ctl button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--bg)}
button:focus-visible,.s:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:26px}
h2{font-size:clamp(22px,3.5vw,30px);margin:0;font-weight:900}
.en{color:var(--mu);margin:0 0 14px;font-size:15px}
.k{border-left:4px solid var(--ac);padding:2px 14px;margin:0 0 18px}
.k b{display:block;font-size:14px;color:var(--ac)}
.k div{margin:2px 0}
.s{display:flex;gap:12px;margin:10px 0;cursor:default}
.s i{flex:none;font-style:normal;font-weight:700;font-size:13px;color:var(--ac);background:var(--acb);border-radius:6px;height:26px;line-height:26px;padding:0 8px;margin-top:3px;min-width:46px;text-align:center}
.mem .s p{filter:blur(7px);cursor:pointer;user-select:none}
.mem .s.o p{filter:none;user-select:auto}
.s p{margin:0}
.para{margin:0;max-width:68ch}
.pn{display:flex;justify-content:space-between;margin-top:22px}
.pn button{font:inherit;background:none;border:1px solid var(--ln);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
.pn button:disabled{opacity:.4;cursor:default}
.tip{margin-top:26px;color:var(--mu);font-size:15px}
</style>
</head>
<body>
<div class="w">
<h1>OWASP Top 10<br>서술형 늘려 쓰기</h1>
<p class="lead">외운 한 줄 포인트를 같은 6단계 틀에 넣어 여러 줄로 늘려 쓰는 연습용 페이지입니다.</p>
<div class="fr"><span>① 풀이</span><span>② 원인</span><span>③ 공격</span><span>④ 결과</span><span>⑤ 대책</span><span>⑥ 요약</span></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="ctl"><button id="bp" aria-pressed="false">한 문단으로 보기</button><button id="bm" aria-pressed="false">암기 모드 (눌러서 확인)</button></div>
<div class="card" id="c"></div>
<p class="tip">쓰는 요령: 외운 포인트를 ①에 그대로 쓰고 이는 ~때문이다, 그 결과, 따라서, 결국 같은 연결어로 이어 가면 5~6줄이 됩니다. 시간이 부족하면 ①, ④, ⑤만 써도 골격이 됩니다.</p>
</div>
<script>
var L=["풀이","원인","공격","결과","대책","요약"];
var D=[
["A01","접근 통제 취약점","Broken Access Control",["기본 거부를 지키지 않아 상대적으로 접근이 쉽다","식별자를 바꿔 남의 계정을 보는 IDOR","PUT, POST, DELETE에 접근 통제가 없는 API"],[
"기본 거부란 공개 리소스 외 모든 자원을 먼저 막고, 명시적으로 허용된 경우에만 열어 주는 원칙을 의미한다.",
"이를 지키지 않으면 막을 곳을 일일이 찾아 차단해야 하므로, 하나라도 빠뜨린 경로는 누구에게나 열린 문이 된다.",
"공격자는 이런 누락을 노려 URL을 추측하거나 관리자 페이지에 직접 접근하는 강제 탐색을 시도한다.",
"그 결과 인증이 필요한 기능과 데이터가 노출되어 정보 유출이나 권한 상승으로 이어질 수 있다.",
"따라서 접근 통제는 서버 측 신뢰 코드에서 기본 거부를 전제로 구현하고, 통제 로직을 한 번 만들어 재사용해야 한다.",
"결국 허용 목록을 기준으로 닫아 두는 것이 접근 통제의 출발점이다."]],
["A02","보안 설정 오류","Security Misconfiguration",["기본 계정과 비밀번호 유지","불필요한 포트, 계정, 서비스, 샘플 앱 활성화"],[
"기본 계정과 비밀번호의 유지란 설치 때 부여된 관리자 계정 정보를 바꾸지 않고 운영 환경에 그대로 쓰는 상태를 의미한다.",
"이런 정보는 제품 문서에 공개되어 있어 누구나 알 수 있으므로 사실상 비밀이 아니다.",
"공격자는 관리 콘솔을 찾아 기본값을 입력해 보는 것만으로 서버 제어권을 얻을 수 있다.",
"그 결과 시스템 전체가 장악되고, 이를 발판으로 내부 확산까지 일어날 수 있다.",
"따라서 기본 자격 증명을 배포하지 않고, 개발, QA, 운영을 동일하게 구성하되 자격 증명은 환경마다 다르게 써야 한다.",
"결국 설치 직후의 기본값을 바꾸는 것이 가장 쉬운 방어이다."]],
["A03","소프트웨어 공급망 실패","Software Supply Chain Failures",["전이 의존성 버전을 추적하지 않음","CI/CD 보안이 대상 시스템보다 약함"],[
"전이 의존성이란 직접 고르지 않았지만 사용 중인 라이브러리가 내부적으로 가져오는 하위 의존성을 의미한다.",
"많은 조직이 직접 의존성만 관리해, 보이지 않는 곳의 취약한 구성요소가 방치된다.",
"공격자는 관리 사각지대의 라이브러리나 방어가 약한 빌드 파이프라인을 노려 악성 코드를 심는다.",
"그 결과 정상 업데이트를 통해 수많은 조직으로 침해가 퍼지며, SolarWinds와 Shai-Hulud가 그 사례이다.",
"따라서 SBOM으로 직접, 전이 의존성을 모두 추적하고, CI/CD에 MFA와 최소 권한을 적용해야 한다.",
"결국 쓰고 있는 모든 구성요소의 목록을 아는 것이 공급망 보안의 출발점이다."]],
["A04","암호화 실패","Cryptographic Failures",["MD5, SHA1 같은 폐기된 알고리즘","암호 키를 소스 저장소에 커밋"],[
"폐기된 알고리즘 사용이란 취약점이 알려진 해시나 암호 방식을 계속 쓰는 것을 의미한다.",
"개발 당시에는 충분했던 방식을 갱신하지 않고 방치하기 때문에 발생한다.",
"공격자는 유출된 데이터를 확보한 뒤 약한 알고리즘의 특성을 이용해 비밀번호를 빠르게 복원한다.",
"그 결과 민감 데이터가 노출되고, 키가 저장소에 있다면 암호화 자체가 무력화된다.",
"따라서 비밀번호는 Argon2나 scrypt 같은 솔트 해시로 저장하고, 키는 HSM이나 비밀 관리 도구에 분리해야 한다.",
"결국 검증된 최신 암호 구현을 쓰고 키를 코드와 분리하는 것이 핵심이다."]],
["A05","인젝션","Injection",["입력을 검증 없이 쿼리에 직접 연결","데이터와 명령 분리(매개변수화)"],[
"입력의 직접 연결이란 사용자 입력값을 SQL이나 OS 명령 문자열에 그대로 이어 붙여 실행하는 것을 의미한다.",
"이 경우 입력값이 데이터가 아니라 명령의 일부로 해석되기 때문에 취약해진다.",
"공격자는 ' OR '1'='1 같은 문자열로 쿼리의 의미를 바꿔 전체 레코드를 조회한다.",
"그 결과 데이터 유출은 물론 임의 명령 실행까지 가능해질 수 있다.",
"따라서 매개변수화 쿼리나 안전한 API, ORM으로 데이터와 명령을 분리하고 서버 측 allowlist 검증을 병행해야 한다.",
"결국 데이터와 명령을 분리하는 것이 인젝션 방어의 핵심이다."]],
["A06","안전하지 않은 설계","Insecure Design",["구현을 완벽히 해도 고쳐지지 않음","위협 모델링"],[
"안전하지 않은 설계란 필요한 보안 통제가 설계 단계에서 누락되었거나 효과가 없는 상태로, 코드 실수인 구현 결함과 구분된다.",
"구현 결함은 코드를 고치면 되지만, 설계 결함은 통제가 애초에 없어 코드를 완벽히 짜도 해결되지 않는다.",
"공격자는 단체 예약의 보증금 규칙 같은 비즈니스 로직의 빈틈을 악용해 좌석을 대량 선점한다.",
"그 결과 코드 취약점 없이도 막대한 금전적 손실이 발생할 수 있다.",
"따라서 요구사항과 설계 단계에서 위협 모델링을 하고, 사용 사례와 오용 사례를 함께 테스트해야 한다.",
"결국 보안은 코딩 이전 단계에서 시작되어야 한다."]],
["A07","인증 실패","Authentication Failures",["크리덴셜 스터핑 허용","MFA 부재"],[
"크리덴셜 스터핑이란 다른 사이트에서 유출된 계정 정보를 대입해 로그인을 자동으로 시도하는 공격을 의미한다.",
"사용자가 비밀번호를 재사용하고 시스템이 자동화 시도를 막지 못하기 때문에 성공한다.",
"최근에는 Winter2025를 Winter2026으로 바꾸는 하이브리드 공격도 확산되고 있다.",
"그 결과 정상 사용자로 위장한 계정 탈취가 발생한다.",
"따라서 MFA를 적용하고, 유출 비밀번호 목록과 대조하며, 로그인 실패를 제한하고 경보를 발생시켜야 한다.",
"결국 비밀번호 하나에만 의존하지 않는 것이 인증 보안의 핵심이다."]],
["A08","소프트웨어·데이터 무결성 실패","Software or Data Integrity Failures",["서명 검증 없는 자동 업데이트","안전하지 않은 역직렬화"],[
"서명 검증 없는 자동 업데이트란 받은 소프트웨어가 정당한 출처에서 변조 없이 왔는지 확인하지 않고 적용하는 것을 의미한다.",
"업데이트는 무조건 믿어도 된다는 잘못된 가정에서 비롯된다.",
"공격자는 변조된 펌웨어나 악성 패키지를 정상 업데이트로 위장해 전달한다.",
"그 결과 신뢰받는 경로를 통해 악성 코드가 기기에서 실행된다.",
"따라서 디지털 서명으로 출처와 변조 여부를 검증하고, 직렬화 데이터는 무결성 검사 없이 신뢰하지 않아야 한다.",
"결국 가져온 것은 반드시 검증하고 쓰는 것이 핵심이다."]],
["A09","보안 로깅·경보 실패","Security Logging and Alerting Failures",["감사 대상 이벤트(로그인 실패 등) 미기록","경보와 대응 플레이북 부재"],[
"감사 대상 이벤트의 미기록이란 로그인 실패나 고가치 거래 같은 중요한 행동이 로그에 남지 않거나 일관되지 않게 남는 것을 의미한다.",
"로그가 있어도 경보와 대응 절차가 없으면 사고를 알아채지 못한다.",
"공격자는 이런 가시성 부족 속에서 오랫동안 들키지 않고 활동한다.",
"실제로 모니터링 부재로 7년 넘게 침해를 몰랐던 사례가 있다.",
"따라서 충분한 컨텍스트와 함께 로깅하고, 변조 방지 감사 추적, 경보 사용 사례, SOC 플레이북을 갖춰야 한다.",
"결국 기록하고, 알리고, 대응하는 세 가지가 모두 있어야 한다."]],
["A10","예외 상황 처리 미흡","Mishandling of Exceptional Conditions",["fail-open","트랜잭션 오류 시 전체 롤백 안 함"],[
"fail-open이란 오류가 났을 때 시스템이 안전하게 막지 않고 열린 상태로 동작하는 것을 의미한다.",
"오류를 발생 지점에서 처리하지 않고 뒤늦게 처리해, 시스템이 다음 동작을 확신하지 못하는 상태가 되기 때문이다.",
"공격자는 일부러 오류를 유발해 상세 오류 메시지로 정보를 얻거나, 다단계 거래를 중간에 끊어 불완전한 상태를 만든다.",
"그 결과 자원 고갈에 의한 서비스 거부, 정보 노출, 계좌 잔액 오류가 생긴다.",
"따라서 오류는 발생 지점에서 처리하고, 트랜잭션은 전체 롤백 후 재시작하는 fail closed로 구성하며 전역 예외 핸들러와 요청 제한을 두어야 한다.",
"결국 실패했을 때 안전하게 닫히도록 설계하는 것이 핵심이다."]]
];
var i=0,para=false,mem=false,tabs=document.getElementById("tabs"),c=document.getElementById("c"),bp=document.getElementById("bp"),bm=document.getElementById("bm");
function show(n){i=n;var d=D[n];
[].forEach.call(tabs.children,function(b,j){b.setAttribute("aria-selected",j==n)});
var body=para?'<p class="para">'+d[4].join(" ")+'</p>':d[4].map(function(t,j){return'<div class="s" tabindex="0"><i>'+(j+1)+" "+L[j]+'</i><p>'+t+'</p></div>'}).join("");
c.className="card"+(mem?" mem":"");
c.innerHTML='<h2>'+d[0]+' '+d[1]+'</h2><p class="en">'+d[2]+'</p><div class="k"><b>외울 포인트</b>'+d[3].map(function(t){return"<div>"+t+"</div>"}).join("")+'</div>'+body
+'<div class="pn"><button '+(n?'':'disabled')+' onclick="show('+(n-1)+')">이전</button><button '+(n<9?'':'disabled')+' onclick="show('+(n+1)+')">다음</button></div>';
[].forEach.call(c.querySelectorAll(".s"),function(s){var f=function(){s.classList.toggle("o")};s.onclick=f;s.onkeydown=function(e){if(e.key=="Enter"||e.key==" "){e.preventDefault();f()}}})}
D.forEach(function(d,n){var b=document.createElement("button");b.setAttribute("role","tab");b.textContent=d[0];b.title=d[1];b.onclick=function(){show(n)};tabs.appendChild(b)});
bp.onclick=function(){para=!para;bp.setAttribute("aria-pressed",para);show(i)};
bm.onclick=function(){mem=!mem;bm.setAttribute("aria-pressed",mem);show(i)};
show(0);
</script>
</body>
</html>
